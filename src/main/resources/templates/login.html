<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - GoldenCat Bank</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F8FAFC] font-['Inter'] min-h-screen flex items-center justify-center">
<div class="bg-white shadow-xl rounded-2xl w-full max-w-md p-8">
    <h2 class="text-3xl font-semibold text-center text-[#0F172A] mb-6">Welcome Back</h2>
    <form method="post" action="/login" class="space-y-5">
        <div>
            <label for="username" class="block text-sm font-medium text-gray-600">Username</label>
            <input type="text" name="username" class="mt-1 block w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" required />
        </div>
        <div>
            <label for="password" class="block text-sm font-medium text-gray-600">Password</label>
            <input type="password" name="password" class="mt-1 block w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" required />
        </div>
        <div class="flex items-center mt-4">
            <input type="checkbox" name="remember-me" id="remember-me"
                   class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
            <label for="remember-me" class="ml-2 block text-sm text-gray-700">
                Remember Me
            </label>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">Login</button>
        <p class="text-sm text-center text-gray-600 mt-4">Don't have an account? <a href="/register" class="text-blue-500 hover:underline">Register</a></p>
    </form>
</div>
</body>
</html>
