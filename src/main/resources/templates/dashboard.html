<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #1e1e2f;
            color: #f1f1f1;
            font-family: 'Segoe UI', sans-serif;
        }

        .sidebar {
            width: 220px;
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            background-color: #2a2a40;
            padding-top: 60px;
        }

        .sidebar a {
            display: block;
            color: #f1f1f1;
            padding: 15px 25px;
            text-decoration: none;
        }

        .sidebar a:hover, .sidebar a.active {
            background-color: #3a3a5a;
            border-left: 4px solid #00d09c;
        }

        .content {
            margin-left: 220px;
            padding: 40px;
        }

        .card-custom {
            background-color: #2a2a40;
            border: none;
            border-radius: 12px;
            color: #fff;
        }

        .form-container {
            background-color: #2a2a40;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .btn-custom {
            background-color: #00d09c;
            border: none;
        }

        .btn-custom:hover {
            background-color: #00b78b;
        }

        .chart-container {
            background-color: #2a2a40;
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <a href="/dashboard" class="active">Dashboard</a>
    <a href="/transactions">Transactions</a>
    <a href="/logout">Logout</a>
</div>

<!-- Main Content -->
<div class="content">
    <h2 class="mb-4" th:text="'Welcome, ' + ${user.username}"></h2>

    <div class="row mb-4">
        <div class="col-md-6 col-lg-4 mb-3">
            <div class="card card-custom p-3">
                <h5>Checking Account</h5>
                <p th:text="'$' + ${checking.balance}"></p>
            </div>
        </div>
        <div class="col-md-6 col-lg-4 mb-3">
            <div class="card card-custom p-3">
                <h5>Savings Account</h5>
                <p th:text="'$' + ${savings.balance}"></p>
            </div>
        </div>
    </div>

    <!-- Deposit Form -->
    <div class="form-container">
        <h5>Deposit</h5>
        <form method="post" action="/deposit">
            <div class="mb-3">
                <label>Select Account</label>
                <select class="form-select" name="accountId" required>
                    <option th:each="acc : ${user.accounts}" th:value="${acc.id}" th:text="${acc.accountType}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label>Amount</label>
                <input type="number" name="amount" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-custom">Deposit</button>
        </form>
    </div>

    <!-- Withdraw Form -->
    <div class="form-container">
        <h5>Withdraw</h5>
        <form method="post" action="/withdraw">
            <div class="mb-3">
                <label>Select Account</label>
                <select class="form-select" name="accountId" required>
                    <option th:each="acc : ${user.accounts}" th:value="${acc.id}" th:text="${acc.accountType}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label>Amount</label>
                <input type="number" name="amount" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-custom">Withdraw</button>
        </form>
    </div>

    <!-- Transfer Form -->
    <div class="form-container">
        <h5>Transfer</h5>
        <form method="post" action="/transfer">
            <div class="mb-3">
                <label>From Account</label>
                <select class="form-select" name="fromAccountId" required>
                    <option th:each="acc : ${user.accounts}" th:value="${acc.id}" th:text="${acc.accountType}"></option>
                </select>
            </div>
            <div class="form-group mb-3">
                <label for="toUsername">To Recipient:</label>
                <select class="form-select" name="toUsername" id="toUsername" required>
                    <option value="" disabled selected>Select a recipient</option>
                    <option th:each="u : ${otherUsers}"
                            th:value="${u.username}"
                            th:text="${u.username}">
                    </option>
                </select>
            </div>
            <div class="mb-3">
                <label>Amount</label>
                <input type="number" name="amount" class="form-control" required>
            </div>

            <!-- ✅ New Description Field -->
            <div class="mb-3">
                <label>Description (optional)</label>
                <input type="text" name="description" class="form-control" placeholder="E.g. Rent, Gift, etc.">
            </div>

            <button type="submit" class="btn btn-custom">Transfer</button>
        </form>
    </div>


    <!-- Chart -->
    <div class="chart-container">
        <canvas id="accountChart" height="100"></canvas>
    </div>

    <canvas id="transactionChart" width="400" height="200"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
        let ctx = document.getElementById('transactionChart').getContext('2d');
        let transactionChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [[${chartLabels}]], // Dates
                datasets: [{
                    label: 'Transaction Amounts',
                    data: [[${chartValues}]], // Amounts
                    borderWidth: 2,
                    fill: false,
                    tension: 0.3,
                    borderColor: '#4CAF50',
                    backgroundColor: '#4CAF50'
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>


</div>
</body>
</html>
