<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transactions - Goldencat Bank</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #f7f9fc;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background-color: #003366;
        }

        .navbar-brand, .nav-link {
            color: #fff !important;
        }

        .container {
            margin-top: 50px;
        }

        .card-custom {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 30px;
        }

        .table thead {
            background-color: #003366;
            color: white;
        }

        .table td {
            vertical-align: middle;
        }

        .text-success {
            font-weight: bold;
            color: #28a745 !important;
        }

        .text-danger {
            font-weight: bold;
            color: #dc3545 !important;
        }

        .custom-link {
            color: #003366;
            text-decoration: underline;
            font-weight: 500;
        }

        canvas {
            max-width: 100%;
            height: 250px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <!-- // MADE BANK TITLE LINK TO DASHBOARD - wilmer -->
    <a class="navbar-brand" href="/dashboard">Goldencat Bank</a>
    <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
    </ul>
</nav>

<div class="container">
    <div class="card card-custom mb-4">
        <h3 class="mb-4 text-center">Transaction History</h3>

        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th>With</th> <!-- Sender or Recipient -->
                    <th>Description</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="transaction : ${transactions}">
                    <td th:text="${transaction.id}"></td>
                    <td th:text="${transaction.type}"></td>
                    <td th:text="${transaction.amount}"
                        th:classappend="${transaction.type == 'Deposit' || transaction.type == 'Transfer In'} ? 'text-success' : 'text-danger'">
                        <span th:text="${transaction.type == 'Deposit' || transaction.type == 'Transfer In'} ? '+$' + transaction.amount : '-$' + transaction.amount"></span>
                    </td>
                    <td th:text="${#temporals.format(transaction.timestamp, 'MMM dd, yyyy HH:mm')}"></td>
                    <td th:text="${transaction.counterparty}">--</td> <!-- Add this dynamically from backend -->
                    <td th:text="${transaction.description}">No description</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card card-custom">
        <h5 class="mb-3 text-center">Transaction Chart</h5>
        <canvas id="transactionsChart"></canvas>
    </div>

    <p class="text-center mt-4">
        <a href="/dashboard" class="custom-link">Back to Dashboard</a>
    </p>
</div>

<script>
    const ctx = document.getElementById('transactionsChart');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], // Replace with real dates
            datasets: [{
                label: 'Weekly Transfers',
                data: [50, 75, 100, 80, 120, 40, 90], // Replace with real data
                borderColor: '#003366',
                fill: false,
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>

</body>
</html>
