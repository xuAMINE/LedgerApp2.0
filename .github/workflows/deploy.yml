name: CI/CD to EC2

on:
  push:
    branches: [ ci/pipeline ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Verify jar file exists
        run: |
          echo "Listing JAR files in target/"
          ls -lh target

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: target/bankapp-0.0.1-SNAPSHOT.jar
          target: /home/ubuntu

      - name: SSH into EC2 and build Docker container
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Go to deployment dir
            cd /home/ubuntu
            
            # Remove old app and Docker artifacts
            docker stop bankapp || true
            docker rm bankapp || true
            docker rmi bankapp || true
            rm -f bankapp.jar
            
            # ✅ Confirm the uploaded jar exists
            if [ -f "bankapp-0.0.1-SNAPSHOT.jar" ]; then
              mv bankapp-0.0.1-SNAPSHOT.jar bankapp.jar
            else
              echo "JAR file not found! Upload may have failed."
              exit 1
            fi
            
            # Create Dockerfile
            echo -e "FROM openjdk:17-jdk-slim\nCOPY bankapp.jar app.jar\nENTRYPOINT [\"java\",\"-jar\",\"app.jar\"]" > Dockerfile
            
            # Build and run
            docker build -t bankapp .
            docker run -d -p 8080:8080 --name bankapp bankapp

      
